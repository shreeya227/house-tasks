# Local development: Postgres only. Run Spring Boot and Vite on the host.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: housetasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
